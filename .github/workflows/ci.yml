name: Build and test
on: [pull_request]
concurrency:
  group: studio-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: mkdir -p reports && rm -f docs/p0-a-screenshot.png
      - id: install
        run: npm ci
      - id: build
        run: npm run build
      - id: unit
        run: npm test -- --reporter=default --reporter=json --outputFile=reports/unit.json
      - name: Compare logic-only baseline and current code
        run: |
          git show b249848b00780653f58d7bb323dde614bbbdf924:src/game/world.ts > reports/world-baseline.ts
          node --experimental-transform-types scripts/logic-benchmark.mjs reports/world-baseline.ts before
          node --experimental-transform-types scripts/logic-benchmark.mjs src/game/world.ts after
      - id: browser_install
        run: npx playwright install --with-deps chromium
      - name: Install video duration probe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Start read-only 661726ed comparison preview
        run: node scripts/start-combat-baseline.mjs
      - id: browser
        run: npm run test:e2e -- --max-failures=1
      - name: Generate truthful studio report
        if: always()
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e 'import fs from "node:fs";fs.mkdirSync("reports",{recursive:true});fs.writeFileSync("reports/steps.json",process.env.STEP_RESULTS);'
          node scripts/studio-report.mjs
      - name: Prepare bounded independent review downloads
        if: always()
        run: node scripts/package-review-evidence.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-report-01
          retention-days: 7
          if-no-files-found: ignore
          path: evidence/report-01/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-report-02
          retention-days: 7
          if-no-files-found: ignore
          path: evidence/report-02/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-screenshots-01
          retention-days: 7
          if-no-files-found: ignore
          path: evidence/screenshots-01/
      - uses: actions/upload-artifact@v4
        if: always()
