name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # One-time bootstrap in the working Actions environment; remove once committed.
      - name: Generate missing lockfile
        if: hashFiles('package-lock.json') == ''
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Save generated lockfile to development branch
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/feat/p0-a-prototype'
        run: |
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            if test -f docs/p0-a-screenshot.png; then git add docs/p0-a-screenshot.png; fi
            git commit -m 'build: record npm lockfile generated and verified in Actions'
            git push origin HEAD:feat/p0-a-prototype
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            package-lock.json
            test-results/
            docs/p0-a-screenshot.png
