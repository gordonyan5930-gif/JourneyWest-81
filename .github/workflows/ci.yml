name: Build and test
on:
  push:
    branches: [feat/p0-a-prototype]
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      full_evidence:
        description: Explicit current-SHA full evidence (not automatic approval)
        type: boolean
        default: false
      source_sha:
        description: Required full40-character current development HEAD
        type: string
        required: false
concurrency:
  group: studio-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}${{ (github.event.action == 'labeled' || github.event_name == 'workflow_dispatch') && format('-{0}', github.event.label.name || inputs.source_sha || 'explicit') || '' }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
  actions: read
jobs:
  verify:
    if: >-
      (github.event_name != 'pull_request' || github.event.action != 'synchronize' || github.head_ref != 'feat/p0-a-prototype') &&
      (github.event_name != 'pull_request' || github.event.action != 'labeled' || startsWith(github.event.label.name, 'full:'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: mkdir -p reports && rm -f docs/p0-a-screenshot.png
      - name: Resolve request and query repository inventory (nonblocking)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/artifact-inventory.mjs
      - id: install
        run: npm ci
      - id: build
        run: npm run build
      - id: unit
        run: npm test -- --reporter=default --reporter=json --outputFile=reports/unit.json
      - name: Compare logic-only baseline and current code
        run: |
          git show b249848b00780653f58d7bb323dde614bbbdf924:src/game/world.ts > reports/world-baseline.ts
          node --experimental-transform-types scripts/logic-benchmark.mjs reports/world-baseline.ts before
          node --experimental-transform-types scripts/logic-benchmark.mjs src/game/world.ts after
      - id: browser_install
        run: npx playwright install --with-deps chromium
      - name: Install diagnostic media tools
        if: env.CAPTURE_FULL_EVIDENCE == 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Start read-only comparison previews
        run: |
          node scripts/start-combat-baseline.mjs
          node scripts/start-motion-baseline.mjs
      - id: browser
        run: npm run test:e2e
      - name: Generate test result (not upload result)
        if: always()
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e 'import fs from "node:fs";fs.mkdirSync("reports",{recursive:true});fs.writeFileSync("reports/steps.json",process.env.STEP_RESULTS);'
          node scripts/studio-report.mjs
      - name: Refresh upload inventory (nonblocking)
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/artifact-inventory.mjs --upload
      - name: Prepare bounded reports and requested evidence
        id: package
        if: always()
        run: node scripts/package-review-evidence.mjs
      - uses: actions/upload-artifact@v4
        id: upload_report
        if: always() && steps.package.outputs.report == 'true'
        continue-on-error: true
        with:
          name: report-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: evidence-upload/report.zip
      - uses: actions/upload-artifact@v4
        id: upload_diagnostics
        if: always() && steps.package.outputs.diagnostics == 'true'
        continue-on-error: true
        with:
          name: diagnostics-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: error
          path: evidence-upload/diagnostics.zip
      - uses: actions/upload-artifact@v4
        id: upload_acceptance_1
        if: always() && steps.package.outputs.acceptance_1 == 'true'
        continue-on-error: true
        with:
          name: acceptance-1-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: error
          path: evidence-upload/acceptance-1.zip
      - uses: actions/upload-artifact@v4
        id: upload_acceptance_2
        if: always() && steps.package.outputs.acceptance_2 == 'true'
        continue-on-error: true
        with:
          name: acceptance-2-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: error
          path: evidence-upload/acceptance-2.zip
      - name: Publish separate upload result and actual expiry
        if: always()
        env:
          UPLOAD_STEPS: ${{ toJSON(steps) }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e 'import fs from "node:fs";fs.mkdirSync("reports",{recursive:true});fs.writeFileSync("reports/upload-steps.json",process.env.UPLOAD_STEPS);'
          node scripts/evidence-receipt.mjs
